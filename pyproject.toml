[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"


# ----------------
# Project metadata
# ----------------
[project]
name = "pyrcs"
version = "1.2.1"
description = "An open-source tool for collecting railway codes used in different UK rail industry systems."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Qian Fu" }
]
keywords = [
    "Python",
    "Railway",
    "Railway Codes",
    "Bridges",
    "Computer Reservation System",
    "CRS",
    "National Location Codes",
    "NLC",
    "Timing Point Locations",
    "TIPLOC",
    "Station Number Names",
    "STANME",
    "Station Numbers",
    "STANOX",
    "Electrification",
    "Engineer's Line References",
    "ELR",
    "Mileage",
    "Line Of Route",
    "LOR",
    "Railway Line Names",
    "Railway Bridges",
    "Stations",
    "Signal Boxes",
    "Tunnels",
    "Viaducts",
    "Depots",
    "Tracks"
]
requires-python = ">=3.12"
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux"
]
dependencies = [
    "pyhelpers~=2.5.3",
    "beautifulsoup4",
    "curl-cffi",
]

[project.urls]
Homepage = "https://github.com/mikeqfu/pyrcs"
Documentation = "https://pyrcs.readthedocs.io/en/latest/"
Repository = "https://github.com/mikeqfu/pyrcs"
"Bug Tracker" = "https://github.com/mikeqfu/pyrcs/issues"
Changelog = "https://github.com/mikeqfu/pyrcs/blob/master/CHANGELOG.md"


# -----------------------
# Local developer tooling
# -----------------------
[dependency-groups]
docs = [
    "furo",
    "sphinx",
    "sphinx-copybutton",
    "sphinx-new-tab-link",
    "sphinx-toggleprompt"
]
notebook = [
    "notebook",
]
test = [
    "coverage",
    "jsonschema[format]",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-xdist",
    "rfc3987-syntax",
]
dev = [
    { include-group = "docs" },
    { include-group = "notebook" },
    { include-group = "test" },
]


# ----------------
# UV configuration
# ----------------
[tool.uv]
link-mode = "copy"
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]


# -------------------
# Build configuration
# -------------------
[tool.hatch.build]
artifacts = [
    "pyrcs/data/**/*"
]

[tool.hatch.build.targets.sdist]
include = [
    "pyrcs",
    "pyproject.toml",
    "CHANGELOG.md",
    "CITATION.cff",
    "LICENSE",
    "README.md"
]
exclude = [
    ".venv",
    "docs",
    "tests",
    "tutorials"
]

[tool.hatch.build.targets.wheel]
packages = ["pyrcs"]

[tool.hatch.build.targets.wheel.force-include]
"pyproject.toml" = "pyrcs/pyproject.toml"

# Custom metadata section
[tool.pyrcs.metadata]
funder = ""
project-name = "PyRCS"
project-start = "2019-08"

[[tool.pyrcs.metadata.corresponding-author]]
name = "Qian Fu"
affiliation = "Birmingham Energy Institute, University of Birmingham"
email = "q.fu@bham.ac.uk"


# --------------------
# Pytest configuration
# --------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-v",
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=pyrcs",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
    "-n",
    "auto"
]
xfail_strict = true

filterwarnings = [
    "error",
    "ignore:Support for class-based `config` is deprecated:UserWarning",
    "ignore:distutils Version classes are deprecated:DeprecationWarning",
    "ignore:codecs\\.open\\(\\) is deprecated:DeprecationWarning",
]

# ----------------------
# Coverage configuration
# ----------------------
[tool.coverage.run]
source = ["pyrcs"]
branch = true
parallel = true
relative_files = true

[tool.coverage.paths]
source = [
    "pyrcs",
    "*/site-packages/pyrcs",
    "*/pyrcs",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Report destinations
[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/htmlcov"
