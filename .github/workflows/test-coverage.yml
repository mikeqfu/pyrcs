name: Test & Coverage

on:
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write  # required for Codecov OIDC

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"  # pre-release early warning
            experimental: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}

      - name: Install system C dependencies for geospatial packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libproj-dev proj-bin

      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups

      - name: Run tests with coverage
        run: |
          uv run --locked pytest --junitxml=reports/junit.xml

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-py${{ matrix.python-version }}   # unique per matrix leg
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true  # no token, no secret, no environment needed
          files: reports/coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: ${{ matrix.experimental != true }}
